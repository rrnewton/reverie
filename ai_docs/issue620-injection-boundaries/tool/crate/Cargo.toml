[package]
name = "poll-select-tool-boundary-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"
members = ["."]

[dependencies]
reverie = { package = "reverie-core", path = "../../../reverie" }
reverie-ptrace = { path = "../../../reverie-ptrace" }
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["full"] }
