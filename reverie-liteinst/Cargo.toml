[package]
name = "reverie-liteinst"
version = "0.2.0"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"
description = "Experimental in-process syscall instrumentation for Reverie"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["preload-constructor"]
preload-constructor = []
liteinst-after-loader-experiment = ["reverie-ptrace/liteinst-after-loader-experiment"]

[[bin]]
name = "reverie-liteinst-strace"
path = "src/bin/strace.rs"

[[bin]]
name = "reverie-liteinst-fork-guest"
path = "src/bin/fork_guest.rs"

[[bin]]
name = "reverie-liteinst-lifecycle-guest"
path = "src/bin/lifecycle_guest.rs"

[dependencies]
bincode = { version = "2", features = ["serde"] }
libc = "0.2.186"
liteinst2 = { version = "0.1.0", path = "../third_party/liteinst2" }
reverie = { version = "0.2.0", path = "../reverie", package = "reverie-core" }
reverie-preload = { version = "0.2.0", path = "../reverie-preload", default-features = false, features = ["coordinator-rpc"] }
reverie-ptrace = { version = "0.2.0", path = "../reverie-ptrace" }
reverie-rpc-transport = { version = "0.2.0", path = "../reverie-rpc-transport" }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.52.4", features = ["macros", "net", "rt", "time"] }
tempfile = "3.27.0"
tracing = "0.1.41"

[dev-dependencies]
goblin = { version = "0.10.7", features = ["elf32", "elf64", "endian_fd"] }
sha2 = "0.10.9"
tokio = { version = "1.52.4", features = ["test-util"] }
tracing-subscriber = "0.3.23"

[[bin]]
name = "reverie-liteinst-trap-count-guest"
path = "src/bin/trap_count_guest.rs"

[[test]]
name = "strace"
path = "tests/strace.rs"

[[bin]]
name = "reverie-liteinst-exec-guest"
path = "src/bin/exec_guest.rs"

[[bin]]
name = "reverie-liteinst-rpc-tool-guest"
path = "src/bin/rpc_tool_guest.rs"

[[bin]]
name = "reverie-liteinst-spoof-guest"
path = "src/bin/spoof_guest.rs"

[[test]]
name = "rpc_tool"
path = "tests/rpc_tool.rs"

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"

[[test]]
name = "after_loader"
path = "tests/after_loader.rs"
required-features = ["liteinst-after-loader-experiment"]

[[test]]
name = "preparation_allocator"
path = "tests/preparation_allocator.rs"
harness = false
