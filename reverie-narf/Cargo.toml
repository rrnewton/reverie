[package]
name = "reverie-narf"
description = "Host (std) face of the Narf Reverie backend"
version = "0.2.0"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"

[dependencies]
# Host builds of the core use Reverie with its default `std` feature.
reverie = { package = "reverie-core", version = "0.2.0", path = "../reverie" }
reverie-narf-core = { version = "0.2.0", path = "../reverie-narf-core" }

[dev-dependencies]
async-trait = "0.1.86"
libc = "0.2.186"
reverie-memory = { version = "0.2.0", path = "../reverie-memory" }
