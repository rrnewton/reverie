# OSS-only external caller artifact over the shared Chaos Tool source.
# Keep a corresponding internal target synchronized before the next export.
[package]
name = "reverie-chaos-dbt-runtime"
version = "0.5.4"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "chaos_caller_tool"
crate-type = ["cdylib"]

[package.metadata.reverie-dbt]
artifact-label = "chaos"
# The maintained producer hashes the shared Tool and its complete source closure.
input-roots = [".."]

# Keep prototype exports out of this explicitly produced caller image.
[workspace]
resolver = "2"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
reverie = { version = "0.5.4", path = "../../reverie", package = "reverie-core" }
reverie-dbt = { version = "0.5.4", path = "../../reverie-dbt", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }

[profile.validate]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = "off"
