# OSS-only external caller artifact over the shared Recorder Tool source.
# Keep a corresponding internal target synchronized before the next export.
[package]
name = "reverie-recorder-dbt-runtime"
version = "0.5.4"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "recorder_caller_tool"
crate-type = ["cdylib"]

[package.metadata.reverie-dbt]
artifact-label = "recorder"
input-roots = [".."]

[workspace]
resolver = "2"

[dependencies]
reverie = { version = "0.5.4", path = "../../reverie", package = "reverie-core" }
reverie-dbt = { version = "0.5.4", path = "../../reverie-dbt", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }

[profile.validate]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = "off"
