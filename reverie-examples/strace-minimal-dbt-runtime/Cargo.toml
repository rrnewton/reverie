# OSS-only external caller artifact over the shared minimal Strace Tool source.
# Keep a corresponding internal target synchronized before the next export.
[package]
name = "reverie-strace-minimal-dbt-runtime"
version = "0.5.4"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "strace_minimal_caller_tool"
crate-type = ["cdylib"]

[package.metadata.reverie-dbt]
artifact-label = "strace-minimal"
# The maintained producer hashes the shared Tool and its complete source closure.
input-roots = [".."]

# Keep prototype exports out of this explicitly produced caller image.
[workspace]
resolver = "2"

[dependencies]
reverie = { version = "0.5.4", path = "../../reverie", package = "reverie-core" }
reverie-dbt = { version = "0.5.4", path = "../../reverie-dbt", default-features = false }

[profile.validate]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = "off"
