# @generated by autocargo from //hermetic_infra/reverie:reverie-process

[package]
name = "reverie-process"
description = "Deterministic async process spawning and management for the Reverie framework."
version = "0.2.0"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"

# `sanitized` is a Meta-internal cfg (set for sanitizer builds to skip
# fork-based tests); declare it as a known cfg name so the open-source build
# does not warn under `unexpected_cfgs`. Reflect this in the autocargo source.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(sanitized)'] }

[dependencies]
bincode = { version = "2", features = ["serde"], optional = true }
bitflags = { version = "2.13.1", features = ["serde"], default-features = false }
colored = { version = "2.1.0", optional = true }
futures = { version = "0.3.31", features = ["async-await", "compat"], optional = true }
libc = { version = "0.2.186", optional = true }
nix = { version = "0.30.1", features = ["dir", "event", "hostname", "inotify", "ioctl", "mman", "mount", "net", "poll", "ptrace", "reboot", "resource", "sched", "signal", "term", "time", "user", "zerocopy"], optional = true }
serde = { version = "1.0.219", features = ["derive"], default-features = false }
syscalls = { version = "0.6.18", features = ["serde"], default-features = false }
thiserror = { version = "2.0.18", optional = true }
tokio = { version = "1.52.4", features = ["full", "test-util", "tracing"], optional = true }

[dev-dependencies]
num_cpus = "1.16"
raw-cpuid = "10.7.0"
tempfile = "3.27.0"

[features]
default = ["std"]
nightly = []
# `std` is everything except the process-identity types: `Command`, containers,
# namespaces, seccomp, ptys, and the host conversions of `Pid`/`ExitStatus`.
# Without it the crate is `no_std` (core only) and exports `Pid`, `ExitStatus`
# and a `Signal` with nix's x86_64 Linux variants.
std = [
    "dep:bincode",
    "dep:colored",
    "dep:futures",
    "dep:libc",
    "dep:nix",
    "dep:thiserror",
    "dep:tokio",
    "serde/rc",
    "serde/std",
    "syscalls/std",
]
