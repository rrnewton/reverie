[workspace]
resolver = "2"
members = [
    "experimental/nostd-print",
    "experimental/reverie-rpc-macros",
    "experimental/reverie-rpc",
    "experimental/riptrace/rpc",
    "reverie",
    "reverie-inguest",
    "reverie-examples",
    "reverie-kvm",
    "reverie-kvm-core",
    "reverie-linux-provider",
    "reverie-linuxemu",
    "reverie-liteinst",
    "reverie-liteinst-artifact",
    "reverie-liteinst-preload",
    "reverie-loader",
    "reverie-memory",
    "reverie-process",
    "reverie-ptrace",
    "reverie-rpc-transport",
    "reverie-syscalls",
    "reverie-test-support",
    "reverie-util",
    "safeptrace",
]
exclude = [
    "public_autocargo/experimental",
]

# Integration-only override (integration/literoot-sprint): build against
# liteinst2 main, which carries the aarch64 root lib, instead of crates.io
# liteinst 0.2.0 (x86-gated encoding_error/detect). Remove when liteinst
# publishes a crates.io release with the aarch64 root lib; do not publish
# from this branch.
[patch.crates-io]
liteinst = { git = "https://github.com/rrnewton/liteinst2", rev = "34901a29a0070f30398f237839a567720c739af5" }
