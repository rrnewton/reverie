[package]
name = "reverie-memory"
description = "Guest-memory access primitives for the Reverie instrumentation framework."
version = "0.2.0"
authors = ["Meta Platforms"]
edition = "2024"
repository = "https://github.com/facebookexperimental/reverie"
license = "BSD-2-Clause"

[dependencies]
syscalls = { version = "0.6.18", features = ["serde"], default-features = false }

[features]
