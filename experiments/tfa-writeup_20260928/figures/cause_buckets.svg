<svg xmlns="http://www.w3.org/2000/svg" width="860" height="358" viewBox="0 0 860 358" role="img" aria-labelledby="t d">
<title id="t">30 flaky test targets by likely flakiness cause, and what Hermit did with each</title>
<desc id="d">Stacked horizontal bars, one per cause bucket, counting targets whose kernel-7.1 campaign outcome was: both seeds found, stopped by the Hermit loader bug (since fixed by PR 3374, not retested), stopped otherwise, or not attempted. Data: cause_buckets.csv.</desc>
<style>.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.mute{fill:#898781}.grid{stroke:#e1e0d9;stroke-width:1}.base{stroke:#c3c2b7;stroke-width:1}.s0{fill:#2a78d6}.l0{fill:#ffffff}.s1{fill:#eb6834}.l1{fill:#0b0b0b}.s2{fill:#1baf7a}.l2{fill:#0b0b0b}.s3{fill:#c3c2b7}.l3{fill:#0b0b0b}text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.grid{stroke:#2c2c2a}.base{stroke:#383835}.s0{fill:#3987e5}.l0{fill:#ffffff}.s1{fill:#d95926}.l1{fill:#ffffff}.s2{fill:#199e70}.l2{fill:#ffffff}.s3{fill:#52514e}.l3{fill:#ffffff}}</style>
