name: Rust

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C link-arg=-llzma

jobs:
  regular:
    name: Regular tests (GitHub-hosted)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Activate DynamoRIO backend source
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      run: scripts/backend-submodule.sh activate dynamorio
    - name: Dependencies
      run: sudo apt-get install -y libunwind-dev liblzma-dev cmake zlib1g-dev
    - name: Rust toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: clippy, rustfmt
    # reverie-dbi/build.rs compiles DynamoRIO (Release) from the pinned submodule
    # on first build, which is expensive on GitHub-hosted runners. Cache the
    # install tree keyed on the DynamoRIO revision and build.rs: build.rs skips
    # the CMake build when the revision stamp, drrun, and DynamoRIOConfig.cmake
    # are already present, so restoring the install short-circuits the build.
    - name: DynamoRIO revision
      id: dynamorio
      run: echo "rev=$(git -C third-party/dynamorio rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Cache DynamoRIO build
      uses: actions/cache@v4
      with:
        path: |
          target/*/build/reverie-dbi-*/out/dynamorio-install
          target/*/build/reverie-dbi-*/out/dynamorio-revision
        key: dynamorio-${{ runner.os }}-${{ steps.dynamorio.outputs.rev }}-${{ hashFiles('reverie-dbi/build.rs') }}
    - name: Build
      run: cargo build --workspace --all-features
    - name: Test regular workspace cases
      run: >-
        cargo test --workspace --all-features --
        --test-threads=1
        --skip container::tests::bind_to_low_port
        --skip container::tests::pin_affinity_to_all_cores
        --skip tests::domainname
        --skip tests::hostname
        --skip tests::local_networking_loopback_flags
        --skip tests::local_networking_ping
        --skip tests::local_networking_there_can_be_only_one
        --skip tests::mount_and_move_tmpfs
        --skip tests::mount_bind
        --skip tests::mount_devpts_basic
        --skip tests::mount_devpts_isolated
        --skip tests::mount_proc
        --skip tests::mount_tmpfs
        --skip tests::pid_namespace
        --skip tests::port_isolation
        --skip tests::seccomp_notify
        --skip tests::uid_namespace
    - name: Documentation tests
      run: cargo test --workspace --doc
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features
    - name: Format
      run: cargo fmt --all -- --check

  hardware:
    name: Host-dependent tests (self-hosted)
    if: >-
      ${{
        vars.REVERIE_SELF_HOSTED == 'true' &&
        (
          github.event_name == 'push' ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.actor == 'rrnewton'
          ) ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.user.login == 'rrnewton'
          )
        )
      }}
    runs-on: [self-hosted, Linux, X64, reverie]
    # PMU/perf-counter determinism tests have a ~2min baseline; a wedged run has
    # squatted a self-hosted runner for hours (observed 2h44m). Cap the whole job
    # at a hard 10 minutes so a wedge fails loudly and fast instead of holding a
    # runner for the 6h GitHub default. The Host-dependent test step is wrapped by
    # scripts/ci-timeout-watchdog.sh, which emits a live thread/wchan snapshot of
    # the hung process tree shortly before this cap fires, so a timeout is
    # diagnosable rather than a bare "job timed out".
    timeout-minutes: 10

    steps:
    # PMU-sensitive tests measure hardware counters whose behaviour changes when
    # the machine is busy: a measurement taken under host contention is INVALID
    # and must be discarded, not reported (same principle as the nightly stress
    # harness validity calibrator). Refuse fast and honestly rather than degrade
    # into a multi-hour hang. Runs first, before build/test, so it reflects
    # AMBIENT load (neighbour/fleet), not this job's own build parallelism.
    - name: Host load precondition (PMU measurement validity)
      env:
        MAX_LOAD_PER_CORE: ${{ vars.REVERIE_MAX_LOAD_PER_CORE || '1.5' }}
        SKIP_LOAD_PRECONDITION: ${{ vars.REVERIE_SKIP_LOAD_PRECONDITION }}
      run: |
        set -euo pipefail
        if [ "${SKIP_LOAD_PRECONDITION:-}" = "true" ]; then
          echo "REVERIE_SKIP_LOAD_PRECONDITION=true -> skipping host-load precondition."
          exit 0
        fi
        read -r load1 _ < /proc/loadavg
        cores="$(nproc)"
        limit="$(awk -v c="$cores" -v m="$MAX_LOAD_PER_CORE" 'BEGIN { printf "%.2f", c * m }')"
        echo "host 1m-load=$load1 cores=$cores max-per-core=$MAX_LOAD_PER_CORE limit=$limit"
        over="$(awk -v l="$load1" -v lim="$limit" 'BEGIN { print (l > lim) ? 1 : 0 }')"
        if [ "$over" = "1" ]; then
          echo "::error title=Host too loaded to measure (not a product failure)::1-minute load average ${load1} exceeds ${limit} (${cores} cores x ${MAX_LOAD_PER_CORE}). PMU/perf-counter determinism tests cannot be measured validly on a contended host, so this run is refused rather than reporting an invalid measurement. This is NOT a Reverie regression. Remedies: re-run on a quiesced host, add a second 'reverie' self-hosted runner (removes the SPOF), raise vars.REVERIE_MAX_LOAD_PER_CORE, or set vars.REVERIE_SKIP_LOAD_PRECONDITION=true to opt out."
          exit 1
        fi
        echo "Host load within budget; proceeding with host-dependent tests."
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Activate DynamoRIO backend source
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      run: scripts/backend-submodule.sh activate dynamorio
    - name: Dependencies
      # Self-hosted `reverie` runners span distros (Debian + Fedora). Select the
      # package manager from /etc/os-release rather than `command -v apt-get`,
      # which is true on some Fedora hosts and made this step run the apt branch
      # there ("Unable to locate package cmake"). The non-fatal
      # "sudo: unable to resolve host" warning is a runner /etc/hosts config
      # issue, not a workflow failure, and must not fail this step.
      run: |
        set -euo pipefail
        distro_id=""; distro_like=""
        if [ -r /etc/os-release ]; then
          . /etc/os-release
          distro_id="${ID:-}"; distro_like="${ID_LIKE:-}"
        fi
        echo "Detected distro: ID='${distro_id}' ID_LIKE='${distro_like}'"
        case " ${distro_id} ${distro_like} " in
          *" fedora "*|*" rhel "*|*" centos "*)
            sudo dnf install -y libunwind-devel xz-devel cmake zlib-devel ;;
          *" debian "*|*" ubuntu "*)
            sudo apt-get install -y libunwind-dev liblzma-dev cmake zlib1g-dev ;;
          *)
            # Unknown distro: prefer dnf, fall back to apt.
            if command -v dnf >/dev/null; then
              sudo dnf install -y libunwind-devel xz-devel cmake zlib-devel
            else
              sudo apt-get install -y libunwind-dev liblzma-dev cmake zlib1g-dev
            fi ;;
        esac
    - name: Rust toolchain
      uses: dtolnay/rust-toolchain@nightly
    - name: Host-dependent workspace tests
      env:
        REVERIE_REQUIRE_KVM: "1"
      # Launch the timeout watchdog as a background sidecar so that, if the test
      # wedges, a live thread/wchan snapshot is emitted shortly before the job's
      # 10-minute hard cap kills it; kill the watchdog once the test completes.
      run: |
        scripts/ci-timeout-watchdog.sh "Host-dependent workspace tests" 510 & watchdog_pid=$!
        cargo test --workspace --all-features -- --test-threads=1
        kill "$watchdog_pid" 2>/dev/null || true
