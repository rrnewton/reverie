name: Dev-hermit operational tooling

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Event-aware cancellation (mirrors hermit #1575). QUEUE-DEPTH-1 on main: all
  # main pushes share one group (github.ref) and cancel-in-progress:false lets the
  # RUNNING job finish while a newer main push supersedes only the older PENDING
  # run. Committing faster only makes the green/red marks SPARSER; it does NOT
  # reduce how many runs COMPLETE. On a pull_request a new push supersedes the
  # older head (that head re-runs when it lands). This stops cancel-in-progress:
  # true from KILLING in-flight main operational-tooling shards, as observed in
  # dev-hermit run 30864011845 @ eb1f094a where tooling shards were cancelled
  # while Portability/Demo stayed queued.
  group: dev-hermit-tooling-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  parent-tooling:
    name: Parent tooling shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check parent scripts and path policy
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 300
          timeout --signal=KILL 1m python3 -m py_compile scripts/*.py
          # The submodules MUST be materialized BEFORE the unit tests, not
          # after. scripts/test_release_0_3_acceptance.py drives
          # scripts/release-0.3-acceptance.py, whose validate_contract() probes
          # every runner/signer `probe_paths` entry with (repo_root/path).
          # exists() -- and two of those live inside hermit/
          # (hermit/scripts/validate.rs, hermit/.github/workflows/ci-portable.yml).
          # With hermit/ still an empty dir the contract reports 2 deployment
          # errors, the report short-circuits to exit_code 2
          # DEPLOYMENT_DEFECT with an EMPTY results list, and all 15 of that
          # file's cases collapse into 37 StopIteration errors + 2 verdict
          # failures. That is what made this shard red from 62bfc534 onward
          # while the same file was 15/15 green locally.
          git -c submodule.agent-utils.update=none submodule update --init --depth 1 -- hermit reverie liteinst2
          timeout --signal=KILL 3m python3 -m unittest discover -s scripts -p "test_*.py"
          timeout --signal=KILL 2m scripts/lint-rust-error-string-proxies.py . hermit reverie liteinst2

      # `if: always()` on every step below, so that ONE red cannot silently
      # disable an unrelated gate by skipping it. A skipped check is not a
      # passing check: it produces no evidence at all, and the job still fails
      # on whichever step actually failed. Observed on 0b8939cd, where the
      # checks below never executed.
      - name: Install rust-script
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          command -v rust-script >/dev/null 2>&1 || cargo install rust-script

      # The status-log mapping schema is what stops the hourly report from
      # rendering an agent's whole ownership set as simultaneous activity. Its
      # tests only gate anything if something runs them.
      - name: Run parent rust-script unit tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 300
          timeout --signal=KILL 1m rustfmt --edition 2021 --check scripts/status-log.rs
          timeout --signal=KILL 5m rust-script --test scripts/status-log.rs

  ci-hub:
    name: ci-hub bounded operations shard
    runs-on: ubuntu-latest
    # 15 was sized for a job that stopped at its first red. With `if: always()`
    # below, every step runs every time, and the six steps that used to be
    # SKIPPED now cost real wall time. Measured basis: steps 1-9 took 4m42s on
    # the runner (job 31239162298, the furthest any run got); the remainder,
    # timed locally, adds release-worktree 147s + agent-utils materialize ~60s
    # + codex-setup 8s + harness-help 1s + live-health 18s + documented --live
    # 124s. That is ~10m40s of measured work, so 15 left no margin on a slower
    # runner and a job timeout would itself have been a new red.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # `if: always()` on EVERY step below, for the same reason the parent
      # shard carries it. Without it this job stops at its first red and every
      # later step is UNRUN -- which reads like a green, is not one, and
      # serializes remediation at one CI round-trip per cause. Measured at
      # 90a2beb: four independent causes were stacked in this one job and it
      # reported exactly one at a time, its "failing step" appearing to wander
      # (`Run deterministic ci-hub suites` -> `Exercise documented ci-hub
      # commands` -> `Compile the typed front door`) across 80+ consecutive red
      # main commits. The job still fails whenever any step fails; this only
      # makes it report all of them in one run.
      - name: Install rust-script
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          command -v rust-script >/dev/null 2>&1 || cargo install rust-script

      - name: Install the pinned Python test runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            --requirement ci-hub/tests/requirements-workflow.txt

      - name: Materialize the pinned Hermit test dependency
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --checkout -- hermit

      - name: Preserve frozen append-only history prefixes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 1m scripts/check-append-only-prefix.py \
            --base e272e66a984fbd6eb5812d15ddab8cdafed4a4b9 \
            ai_docs/status-log/status-log.jsonl worktrees/ARCHIVED.md

      - name: Compile the typed front door
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 240
          timeout --signal=KILL 4m ci-hub/ci-hub --help >/dev/null
          timeout --signal=KILL 2m rust-script --test ci-hub/ci-hub.rs

      - name: Run deterministic ci-hub suites
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 240
          timeout --signal=KILL 1m python3 -m compileall -q ci-hub
          timeout --signal=KILL 1m \
            rustfmt --edition 2021 --check ci-hub/ci-hub.rs ci-hub/lib/*.rs
          timeout --signal=KILL 8m \
            python3 ci-hub/tests/run_python_suites.py

      - name: Exercise documented ci-hub commands without side effects
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 240
          timeout --signal=KILL 4m python3 ci-hub/tests/documented_commands.py

      - name: Prove worktree release is target-scoped
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 240
          timeout --signal=KILL 4m scripts/release-worktree-target-scope-test.sh

      - name: Materialize the pinned live-query and topology dependency
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git -c submodule.agent-utils.update=checkout \
            submodule update --init --checkout -- agent-utils
          python3 -m pip install --disable-pip-version-check PyYAML
          mkdir -p "$RUNNER_TEMP/bin"
          printf '%s\n' '#!/usr/bin/env bash' 'exec "$@"' \
            >"$RUNNER_TEMP/bin/with-proxy"
          chmod +x "$RUNNER_TEMP/bin/with-proxy"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Verify the live Claude and Codex skill topology
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 240
          timeout --signal=KILL 4m python3 scripts/check-codex-setup.py

      - name: Assert harness help probes are pure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 240
          timeout --signal=KILL 4m python3 scripts/check-harness-help.py

      - name: Classify bounded live GitHub health
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HUB_MAIN_HEALTH_TIMEOUT: "4"
          CI_HUB_MAIN_HEALTH_DEADLINE: "6"
          CI_HUB_PR_STATUS_TIMEOUT: "8"
          CI_HUB_PR_STATUS_DEADLINE: "10"
        shell: bash
        run: |
          set -euo pipefail
          python3 ci-hub/tests/live_health_probe.py \
            --repo rrnewton/dev-hermit \
            --wall-seconds 30 \
            --cpu-seconds 15 \
            --log "$RUNNER_TEMP/ci-hub-live-health.log"

      - name: Exercise networked documented commands
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ulimit -t 300
          timeout --signal=KILL 5m python3 ci-hub/tests/documented_commands.py --live

      - name: Upload live health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-hub-live-health-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-hub-live-health.log
          if-no-files-found: warn
          retention-days: 14
