name: Compat envelope

# Cross-backend compatibility regression gate. Enshrines the compat-envelope
# scorecard (compat-envelope/) into CI so the golden-ptrace denominator and the
# backend parity/determinism cells stay green (green-stays-green).
#
# Two lanes, matching the Makefile targets:
#   * portable  (ubuntu-latest, always-on): ptrace golden denominator, run against
#     a RELEASE binary (a debug build blows the harness per-test timeout on
#     subprocess-heavy cells). DBI/SaBRe/KVM are not built here and are recorded
#     n/a (never a false red).
#   * privileged (self-hosted PMU runner): `make compat-envelope-full` — adds the
#     DBI backend, SaBRe, and the reverie B1.5 ptrace-vs-KVM boundary (needs
#     /dev/kvm + the counter launchers). rrnewton-guarded like the demo sweep.
# MANUAL INVOCATION ONLY -- owner directive 2026-08-21: "I would like our CI on
# GitHub to remain disabled in the sense that it does not run automatically...
# I want an agent that is investigating CI to be able to kick off runs manually
# on recent main commits". NO push, NO pull_request, NO schedule, NO merge_group,
# NO workflow_run: nothing here may start a run by itself.
#
# THE REPOSITORY ACTIONS SWITCH AND THIS FILE ARE ONE MECHANISM, NOT TWO. While
# the switch was off (2026-08-11 .. 2026-08-21) a dispatch RETURNED SUCCESS and
# created a queued run with ZERO JOBS that never executed, could not be cancelled
# (HTTP 500) and could not be deleted (HTTP 403) -- so "manual runs work" required
# turning the switch back on, and turning it on would have resurrected every
# automatic trigger in this file. Removing the triggers is what makes the switch
# safe to leave on. Put a push/pull_request/schedule trigger back here and the
# owner's directive is broken repository-wide, silently.
#
# THIS IS NOT A GATE. Nothing blocks a landing on the result (owner directive
# 2026-08-17); the job body below is UNCHANGED so what it measures stays
# comparable with local `make validate`.
#
# Kick one off:  ./ci-hub/bin/manual-run --workflow compat-envelope.yml [--commit SHA]
on:
  workflow_dispatch:
concurrency:
  group: compat-envelope-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # libunwind on the GitHub-hosted image is built WITH LZMA support (compressed
  # .gnu_debugdata / minidebuginfo), so `-lunwind -lunwind-generic
  # -lunwind-ptrace` -- which the third-party `unwind-sys` crate emits -- drags in
  # six lzma_* symbols that nothing else supplies. Without this the release build
  # fails to LINK and the gate never reaches the denominator step at all:
  #   rust-lld: error: undefined reference: lzma_stream_buffer_decode  (+5 more)
  # liblzma-dev is already installed below; it was the LINK FLAG that was missing,
  # not the package. This is NOT host-universal -- a libunwind built without LZMA
  # (e.g. the devbox: 0 lzma refs in /lib64/libunwind.so) links fine unflagged.
  #
  # This line is copied from rrnewton/hermit, where the IDENTICAL remedy appears in
  # SIX workflows (ci-dag, ci-portable, ci-privileged, demo-hot-path, docs,
  # validation-levels). That duplication is the argument for moving it to
  # hermit-cli/build.rs instead: this gate is the SEVENTH consumer and the first in
  # another repository, so it never inherited the copy-paste and rediscovered the
  # breakage as a red gate. Tracked separately; this env var unblocks the gate now.
  RUSTFLAGS: -C link-arg=-llzma

jobs:
  portable-denominator:
    name: Portable ptrace denominator gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update || echo "::notice::apt-get update failed; using existing metadata"
          sudo apt-get install -y \
            build-essential clang cmake curl file git gzip \
            libunwind-dev liblzma-dev pkg-config python3

      - name: Ensure the repository Rust toolchain
        working-directory: hermit
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermit -> target
          shared-key: compat-envelope-portable
          cache-on-failure: true
          cache-bin: false

      - name: Install rust-script
        shell: bash
        run: |
          set -euo pipefail
          command -v rust-script >/dev/null 2>&1 || cargo install rust-script

      - name: Build release hermit (ptrace) and run the ptrace denominator gate
        shell: bash
        run: |
          set -euo pipefail
          cd hermit && cargo build --release -p hermit --bin hermit --no-default-features
          cd ..
          HERMIT_BIN="$PWD/hermit/target/release/hermit" \
            compat-envelope/validate-envelope.sh --lane portable \
            --backends ptrace --no-reverie

      - name: Upload rendered scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-envelope-portable-${{ github.run_id }}
          path: |
            compat-envelope/scorecard.csv
          if-no-files-found: warn
          retention-days: 14

  privileged-full:
    name: Privileged full-backend gate (DBI + SaBRe + KVM/reverie)
    # The privileged self-hosted runner has /dev/kvm, PMU, and the full build
    # deps. Fork-authored PR code must not run there; rrnewton branches are the
    # trusted PR surface, matching nightly-demo-sweep.
    if: >-
      ${{
        github.repository == 'rrnewton/dev-hermit' &&
        (
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/main' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.user.login == 'rrnewton')
        )
      }}
    runs-on: [Linux, X64, hermit, pmu, pmu-serial]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure the repository Rust toolchain
        working-directory: hermit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            hermit -> target
            reverie -> target
          shared-key: compat-envelope-full
          cache-on-failure: true
          cache-bin: false

      - name: Install rust-script
        shell: bash
        run: |
          set -euo pipefail
          command -v rust-script >/dev/null 2>&1 || cargo install rust-script

      - name: SaBRe source + full-backend compat gate
        shell: bash
        run: |
          set -euo pipefail
          make checkout-sabre || echo "::notice::checkout-sabre failed; SaBRe cells record n/a"
          make compat-envelope-full

      - name: Upload rendered scorecards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-envelope-full-${{ github.run_id }}
          path: |
            compat-envelope/scorecard.csv
            compat-envelope/reverie-scorecard.csv
          if-no-files-found: warn
          retention-days: 14
