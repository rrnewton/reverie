name: P0 demo regression gate + nightly super backstop

# The demos are expensive, so commits and pull requests run them only when a
# demo-relevant parent path changes. `hermit` and `reverie` are gitlinks: a pin
# update covers inner Detcore, scheduler, timer, and instrumentation changes.
# The nightly schedule remains the unconditional backstop and additionally runs
# Hermit's full super stress profile.
# MANUAL INVOCATION ONLY -- owner directive 2026-08-21: "I would like our CI on
# GitHub to remain disabled in the sense that it does not run automatically...
# I want an agent that is investigating CI to be able to kick off runs manually
# on recent main commits". NO push, NO pull_request, NO schedule, NO merge_group,
# NO workflow_run: nothing here may start a run by itself.
#
# THE REPOSITORY ACTIONS SWITCH AND THIS FILE ARE ONE MECHANISM, NOT TWO. While
# the switch was off (2026-08-11 .. 2026-08-21) a dispatch RETURNED SUCCESS and
# created a queued run with ZERO JOBS that never executed, could not be cancelled
# (HTTP 500) and could not be deleted (HTTP 403) -- so "manual runs work" required
# turning the switch back on, and turning it on would have resurrected every
# automatic trigger in this file. Removing the triggers is what makes the switch
# safe to leave on. Put a push/pull_request/schedule trigger back here and the
# owner's directive is broken repository-wide, silently.
#
# THIS IS NOT A GATE. Nothing blocks a landing on the result (owner directive
# 2026-08-17); the job body below is UNCHANGED so what it measures stays
# comparable with local `make validate`.
#
# Kick one off:  ./ci-hub/bin/manual-run --workflow nightly-demo-sweep.yml [--commit SHA]
on:
  workflow_dispatch:
concurrency:
  # Preserve every main-push run for exact culprit attribution. Pull requests
  # share a group so a superseded head does not consume the scarce serial host.
  group: demo-sweep-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings -C link-arg=-llzma
  RUSTDOCFLAGS: -D warnings
  DETCORE_TEST_RUST_LOG: "off"
  SUPER_REPETITIONS: "20"
  VALIDATE_GATE_TIMEOUT_SECONDS: "7200"
  DEMO08_REQUIRE_ASSETS: "1"

jobs:
  super-and-demos:
    name: P0 demo gate (demos 1-8; nightly also runs super)
    # The serial PMU runner is privileged; fork-authored PR code must not run
    # there. rrnewton branches (including drafts) are the trusted PR surface.
    if: >-
      ${{
        github.repository == 'rrnewton/dev-hermit' &&
        (
          github.event_name == 'pull_request' ||
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/main'
        )
        &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.user.login == 'rrnewton'
        )
      }}
    runs-on: [Linux, X64, hermit, pmu, pmu-serial]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Ensure the repository Rust toolchain
        working-directory: hermit
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            rustup_init="$RUNNER_TEMP/rustup-init.sh"
            download=(curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$rustup_init")
            if command -v with-proxy >/dev/null 2>&1; then
              with-proxy "${download[@]}"
            else
              "${download[@]}"
            fi
            install_rustup=(sh "$rustup_init" -y --profile minimal --default-toolchain none)
            if command -v with-proxy >/dev/null 2>&1; then
              with-proxy "${install_rustup[@]}"
            else
              "${install_rustup[@]}"
            fi
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$channel"
          install_toolchain=(rustup toolchain install "$channel" --profile minimal --component clippy --component rustfmt)
          if command -v with-proxy >/dev/null 2>&1; then
            with-proxy "${install_toolchain[@]}"
          else
            "${install_toolchain[@]}"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hermit -> target
          shared-key: nightly-super-validation
          cache-on-failure: true
          # rustup/cargo are host prerequisites, not disposable cache entries.
          cache-bin: false

      - name: Install host dependencies (Debian/Ubuntu or Fedora/RHEL)
        shell: bash
        run: |
          set -euo pipefail
          if command -v dnf >/dev/null; then
            sudo dnf makecache || echo "::notice::dnf makecache failed; using existing metadata"
            sudo dnf install -y \
              autoconf automake binutils bpftool busybox cpio e2fsprogs e2fsprogs-devel \
              clang cmake curl elfutils-libelf-devel file gcc gcc-c++ git gdb gzip \
              java-latest-openjdk-devel lua \
              libblkid-devel libunwind-devel libuuid-devel libzstd-devel \
              lzo-devel make patch pkgconf-pkg-config python3 python3-devel \
              python3-pip qemu-img qemu-kvm-core ruby tcl-devel xz-devel zlib-devel
          elif command -v apt-get >/dev/null; then
            sudo apt-get update || echo "::notice::apt-get update failed; using existing metadata"
            sudo apt-get install -y \
              autoconf automake binutils bpftool build-essential busybox-static cpio \
              clang cmake curl default-jdk-headless e2fsprogs file gdb git gzip libblkid-dev \
              libdw-dev libelf-dev libext2fs-dev liblzo2-dev liblzma-dev \
              libunwind-dev libzstd-dev lua5.4 patch pkg-config python3 python3-dev \
              python3-pip qemu-system-x86 qemu-utils ruby tcl-dev uuid-dev zlib1g-dev
          else
            echo "::error::Unsupported package manager"
            exit 1
          fi

          if ! command -v drgn >/dev/null 2>&1; then
            if command -v with-proxy >/dev/null 2>&1; then
              with-proxy python3 -m pip install --user drgn || \
                with-proxy python3 -m pip install --user --break-system-packages drgn
            else
              python3 -m pip install --user drgn || \
                python3 -m pip install --user --break-system-packages drgn
            fi
            echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          fi

      - name: Heavy-demo preflight
        run: |
          set -euo pipefail
          make doctor-qemu
          command -v bpftool drgn gcc readelf mkfs.ext4 patch
          test -r /proc/sys/kernel/perf_event_paranoid
          unshare --user --map-root-user --pid --fork true

      - name: Verify Demo 8 calibration evidence brackets
        run: scripts/test-prepare-demo08-calibration.sh

      - name: Restore pinned heavy-demo assets
        uses: actions/cache@v4
        with:
          path: |
            ignored/demo08-btrfs
            ignored/demo08-build/btrfs-progs-v7.1
          key: nightly-demo-assets-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Prepare pinned Demo 8 btrfs/ASAN assets
        run: scripts/prepare-demo08-assets.sh

      - name: Run hot-path demo gate or nightly super profile
        run: |
          set -euo pipefail
          scope=()
          if [[ "${{ github.event_name }}" == push || \
                "${{ github.event_name }}" == pull_request ]]; then
            scope+=(--demos-only)
            echo "Hot-path ${{ github.event_name }}: running demos 1-8."
          else
            echo "Nightly/manual backstop: running Hermit super + demos 1-8."
          fi
          if command -v with-proxy >/dev/null 2>&1; then
            with-proxy scripts/super-validate.sh "${scope[@]}" \
              2>&1 | tee demo-sweep-validation.log
          else
            scripts/super-validate.sh "${scope[@]}" \
              2>&1 | tee demo-sweep-validation.log
          fi

      - name: Upload per-demo and validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-sweep-${{ github.event_name }}-${{ github.run_id }}
          path: |
            demo-sweep-validation.log
            target/demo-sweep/
            ignored/qemu-linux/boot-anchor/run-metadata.json
            ignored/qemu-linux/run-history/*/run-metadata.json
            ignored/demo07-drgn/
            ignored/demo08-run/*.txt
            ignored/demo08-run/*.out
            ignored/demo08-run/*.tsv
            hermit/target/validate-results.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Escalate every demo red as P0
        if: failure()
        run: |
          echo "::error title=P0 Hermit demo regression::Demos 1-8 or the nightly super profile failed at ${{ github.event.pull_request.head.sha || github.sha }}. Treat this red as P0; inspect the per-demo summary and uploaded logs."
          {
            echo
            echo "## P0 demo-regression escalation"
            echo "**Owner policy: any demo-sweep red is P0.**"
            echo
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Commit: \`${{ github.event.pull_request.head.sha || github.sha }}\`"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Review the failed per-demo row and artifact logs immediately;"
            echo "the path-filtered run identifies the parent commit/PR that introduced it."
          } >>"$GITHUB_STEP_SUMMARY"
          exit 1
