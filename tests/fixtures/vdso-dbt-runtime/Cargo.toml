# OSS-only caller artifact over the unchanged generic test Tool fixture.
# The explicit producer keeps this package separate from workspace features.
[package]
name = "reverie-vdso-dbt-runtime"
version = "0.5.4"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "vdso_caller_tool"
crate-type = ["cdylib"]

[package.metadata.reverie-dbt]
artifact-label = "vdso"
input-roots = ["../../tool_fixtures"]

[workspace]
resolver = "2"

[dependencies]
reverie = { version = "0.5.4", path = "../../../reverie", package = "reverie-core" }
reverie-dbt = { version = "0.5.4", path = "../../../reverie-dbt", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }

[profile.validate]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = "off"
