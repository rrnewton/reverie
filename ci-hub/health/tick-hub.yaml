description: |-
  Operational health polling for the dev-hermit coordinator. The outer ORC
  workflow runs one tick every sixty minutes; this config owns each check's
  cadence and only emits actions when a hard warning is required. No active
  reminder declares a cadence below the outer interval: such a value cannot be
  honored and would read as configuration while controlling nothing.

  ADMISSION TEST FOR ANY NEW REMINDER (owner directive, 2026-08-08).
  Ask: CAN ORC OBSERVE THIS DIRECTLY?
    YES -> it does not belong here. ORC holds the authoritative view of agents,
           panes, tasks and ownership; a second observer of the same fact cannot
           be more right, only differently wrong, and its disagreement arrives
           as an instruction to a coordinator mandated to close and respawn
           agents without asking. Agent liveness, task ownership, and TaskGraph
           census are permanently out of scope.
    NO  -> it belongs here. GitHub, GH Actions queues, runner lanes, merge gates,
           local disk consumption and local git state are exactly the things the
           coordinator genuinely cannot see, and reminding it is the whole point.

  Weight proposals by what the alarm CAUSES, not only by whether it is accurate.
  A false alarm about GitHub costs a wasted check; a false alarm about
  orc-internal state costs an agent. Prefer DETECT-ONLY: a gate that reports a
  fact leaves the decision where the authority is.

  `tick-hub list` is the canonical reminder count.
  The ledger spool backlog joins the local-but-ORC-invisible measurements because
  only the filesystem carries unpublished batch age. Four ORC-internal gates were
  removed on 2026-08-08; the removal record is inline below, above
  `agent_container_lifecycle`.

reminders:
  # merge-gate-v4 is fail-closed: on a queued leg it records NO_RESULT, RE-DISPATCHES
  # the leg and CANCELS ITSELF, leaving `refire-on-ci-completion` to restart it. That
  # refire CANNOT ARRIVE for the runs the gate itself dispatched: it re-dispatches with
  # GH_TOKEN=github.token, so the runs carry triggering_actor=github-actions[bot], and
  # GitHub suppresses workflow_run events for GITHUB_TOKEN-triggered runs. Measured on
  # hermit#1750 (both legs completed SUCCESS, no refire ever came) and again at its
  # rebased head. This is genuinely external state ORC cannot see, so the reminder
  # EARNS its place -- a PR sits BLOCKED with 30/30 green and every count-based view
  # renders it identically to a PR that is merely waiting.
  #
  # STILL DOES NOT AUTO-FIRE: re-running dozens of gates at once is a mass dispatch
  # that would starve the very runners the legs need. `gate_refire.py --refire`
  # performs the action under a human decision.
  #
  # RE-SCOPED 2026-08-08 under the satisfiability test above. It was
  # `--fail-on-due`, i.e. `return 1 if due else 0`: pure standing state, paging every
  # 30 min for a backlog no tick may drain, which is shape (b) and trains the
  # recipient to ignore the channel. Worse, `render()` emitted prose with no
  # key=value lines, so `capture: true` found nothing and the action went out with a
  # LITERAL `{summary}` naming ZERO PRs -- firing constantly AND naming nothing.
  # `--gate` pages on the DELTA (a PR NEWLY refire-due), names each PR with its gate
  # run id and the exact remedy command, and carries the standing set plus
  # heads_covered/heads_total in the fields. That denominator is load-bearing: the
  # bounded scan covered 70 of 139 heads when measured, so "10 due" is a floor, not
  # a census (the tool's own docstring records the bounded scan finding 2 where the
  # exhaustive --per-pr scan found 41). A PR merely outside the sampling window is
  # never retired from the delta baseline, so window drift cannot forge new pages.
  - name: merge_gate_refire_due
    cadence_secs: 3600
    gate:
      cmd: python3 ci-hub/health/gate_refire.py --repo rrnewton/hermit --gate --state "$DEV_HERMIT_PARENT/.tick-hub/gate-refire-due.json"
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: merge-gate-refire
      title: "a merge gate newly parked with all legs finished; refire is due: {summary}"

  # DISK RECLAMATION. Huge slots sit under worktrees/ long after anything was
  # working in them; that is the real, durable problem and it stays monitored.
  #
  # This REPLACES `worktree_new_dead_owner`, which asked the same question the
  # wrong way: "is the owning AGENT dead?" ORC owns the fleet and answers that
  # authoritatively, so a second guess derived from a registry file could only
  # manufacture disagreement -- and on 2026-08-08 it did, alarming that an agent
  # had died while that agent held the freshest activity timestamp on the box.
  # Under the autonomous-replacement mandate, obeying it would have destroyed a
  # live agent mid-P0. The replacement asks only what tick-hub can legitimately
  # observe and ORC cannot: is a directory on disk consuming space with no live
  # process inside it? No agent name, no fleet census, no TaskGraph owner.
  #
  # Occupancy is /proc cwd (unforgeable, cannot go stale). Idleness must be
  # SUSTAINED >= 24h, which is what makes the ~0.6% unreadable-cwd blind spot
  # tolerable. DELTA, not standing state: it pages only when a slot NEWLY
  # qualifies, and carries the standing backlog in captured fields so a
  # permanently-on gate never gets muted. DETECT ONLY -- reclaim needs a
  # recovery SHA and stays a coordinator decision.
  # PARITY, not capacity. worktree_disk_residue below asks "are there too many
  # slots" against a hand-maintained cap of 12; this asks "does each active slot
  # have anybody behind it", whose denominator is however many agents are alive
  # right now and therefore needs no maintenance. Added 2026-08-24, when the
  # fleet held 170 slots against 13 live agents and the gap named by
  # ai_docs/2026-08-09-worktree-discipline-audit.md section C4 -- "Rule 6 is a
  # parity predicate and nothing computes it" -- was still open fifteen days on.
  #
  # A zero-agent census is a REFUSAL inside the gate, never a pass, and every
  # report carries live_agents_examined so a green verdict shows its
  # denominator. It also prints per-repo git worktree counts, which no other
  # check counts: 310 registrations in hermit alone were invisible.
  #
  # emit.skill stays hard-warn-coordinator, and that is NOT an endorsement. C4's
  # remedy was to re-route to an actor with a shell -- specifically hermit-coord
  # -- but .agents/skills/hermit-coord is a DANGLING symlink into
  # .claude/skills, which the 2026-08-16 skills bankruptcy moved into
  # .skill_reset_20260816/. Pointing this emit at a skill nothing can load would
  # be worse than the actor that cannot act, so the routing debt is recorded
  # here rather than paid with a name that resolves to nothing. All 23 emitting
  # reminders share this one channel; the delivery repair belongs there, not in
  # a per-reminder rename.
  - name: slot_agent_parity
    cadence_secs: 3600
    gate:
      cmd: python3 ci-hub/health/slot_agent_parity.py --gate --root "$DEV_HERMIT_PARENT"
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: slot-agent-parity
      title: "active slots have no live agent behind them: {summary}"
  # ⚠️ A DELETED TOOL CAME BACK UNTRACKED AND MERGED A HEAD.
  # `ci-hub/bin/gh-pr-merge-verified` was added 01:03 and deleted 01:25 on
  # 2026-08-25 (8cc9a975) in favour of gh-merge-verified; by 04:38 it was back in
  # the coordinator's checkout, UNTRACKED and executable, with no changes-request
  # guard, and it merged hermit#2448 at 16:22:53Z. The deletion was already argued
  # in gh-merge-verified's own docstring, explicitly "so the deleted one is not
  # reintroduced by someone who only sees the shape of the hole" -- correct, and
  # it did not work. A documented deterrent is not a mechanism.
  #
  # PASSES THE ADMISSION TEST: an untracked file in a checkout is LOCAL GIT STATE,
  # which this config names as exactly what the coordinator cannot see. `git log`
  # for the path reports only the add and the delete, so the repository actively
  # says it is gone while it sits there running.
  #
  # DETECT-ONLY on purpose. It never deletes: the file came back once already, so
  # a second silent deletion is the move that did not hold the first time, and it
  # would destroy an agent's in-progress work without asking.
  - name: deleted_tool_absent
    cadence_secs: 3600
    gate:
      cmd: python3 ci-hub/health/deleted_tool_absent.py --root "$DEV_HERMIT_PARENT"
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: deleted-tool-reintroduced
      title: "a deliberately-deleted tool is back on this disk: {summary}"
  - name: worktree_disk_residue
    cadence_secs: 3600
    gate:
      # One guarded bulk owner census replaces one subprocess/registry-lock
      # acquisition per row. Candidate sizing is one bounded `compsize` call
      # over the complete current set, never a sum of cached per-slot values.
      # This deduplicates reflinks within the set and refuses an unavailable or
      # physically impossible result instead of printing an invented total.
      cmd: python3 ci-hub/health/slot_disk_residue.py --gate --size-timeout 5 --root "$DEV_HERMIT_PARENT" --state "$DEV_HERMIT_PARENT/.tick-hub/slot-disk-residue-state.json" --registry "$DEV_HERMIT_PARENT/worktree-state.json"
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: worktree-disk-residue
      title: "worktree slots are idle on disk and reclaimable: {summary}"

  # WRKSLOTS IS THE LIFECYCLE AUTHORITY. The expensive audit now runs from an
  # independent persistent calendar timer, outside this tick's 180-second
  # aggregate wall cap. This cheap gate consumes only its typed atomic result.
  # Missing, stale, malformed, or wrong-provenance evidence is NO_RESULT: an
  # absent audit can never make the ordinary health tick green. A parent-main
  # advance intentionally creates that visible NO_RESULT window until the next
  # independent audit publishes evidence from the same exact tool revision.
  - name: wrkslots_audit
    cadence_secs: 3600
    gate:
      timeout_secs: 10
      cmd: python3 ci-hub/health/wrkslots_audit_result.py --result "$DEV_HERMIT_PARENT/ignored/ci-hub/wrkslots-audit/latest.json" --max-age-secs 7200
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: wrkslots-audit
      title: "wrkslots audit result needs attention: {summary}"

  # REGISTRY/STORAGE DISAGREEMENT. `wrkslots doctor` is read-only, exits 0
  # whatever it finds, and prints only when a human runs it. Measured 2026-09-03:
  # 122 findings were sitting there unreported -- 47 row-without-directory, 73
  # dead-owner, 2 unregistered-directory -- because nothing ever asked. A check
  # that reports 122 findings on demand and nothing otherwise is
  # indistinguishable from a healthy system.
  #
  # THIS IS NOT THE SAME QUESTION AS `wrkslots_audit` ABOVE. That gate covers a
  # DELETABLE slot, an interrupted operation, or an unregistered directory; it
  # does NOT cover row-without-directory, which is 47 of the 122. It is also too
  # slow to answer here: measured 2026-09-03 on a 93-row registry it had not
  # finished at 400s while its own reminder allows 120s, where `doctor` answered
  # the same registry in 31s.
  #
  # DELTA, NOT STANDING STATE, for the same reason worktree_disk_residue is:
  # with 122 findings already present a standing-state gate would fire hourly
  # forever and be filtered out within a week. It pages only on a NEW finding,
  # the first run adopts the current set as a baseline without paging, and the
  # standing counts ride along in the captured fields so the backlog stays
  # visible without ever muting the line.
  #
  # DETECT ONLY. It retires, archives and reclaims nothing. Reclamation is a
  # separate authorised decision and must stay one: a slot holding an unread
  # HANDOFF.md is protected by the FILE, not by its registry row, so anything
  # acting at the registry level would not see that protection.
  #
  # The standing population is NOT a lifecycle leak -- the archive is complete at
  # 145 of 145 and the stuck rows were removed cleanly outside wrkslots -- so
  # this line reports visibility, not a defect.
  - name: wrkslots_doctor_findings
    cadence_secs: 3600
    gate:
      timeout_secs: 180
      cmd: python3 ci-hub/health/wrkslots_doctor_findings.py --gate --root "$DEV_HERMIT_PARENT" --wrkslots "$DEV_HERMIT_PARENT/ci-hub/bin/wrkslots" --state "$DEV_HERMIT_PARENT/.tick-hub/wrkslots-doctor-state.json" --timeout 120
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: wrkslots-doctor-findings
      title: "wrkslots registry and storage newly disagree: {summary}"

  # VALIDATE CHECKOUT CLEANUP MUST OUTLIVE THE PROCESS THAT STARTED THE RUN.
  # The launcher's waiter removes its checkout on the normal completion path,
  # but agents end, panes disappear, and waiters are killed while their detached
  # systemd units continue.  Before this recurring pass, every such run left a
  # checkout forever.  The manual sweep also queried every retained run record,
  # including bench records it cannot interpret; cleanup now considers only
  # records whose disposable checkout or Cargo home still exists.
  #
  # This runs the existing evidence-preserving cleanup: checkout-local receipts
  # are archived first, active units and paths held by live processes are kept,
  # and only then is a terminal checkout removed.  A running checkout is an
  # expected retention and stays quiet; any other retained path is a failure.
  - name: validate_checkout_cleanup
    cadence_secs: 3600
    gate:
      timeout_secs: 30
      cmd: python3 ci-hub/health/validate_checkout_cleanup.py --state-root /home/newton/work/dev-hermit
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: validate-checkout-cleanup
      title: "terminal validate checkout cleanup needs attention: {summary}"

  # rust-script keys generated packages by absolute source path. Short-lived
  # test fixtures and worktrees therefore leave durable compiled artifacts in
  # the user's shared cache. Measured 2026-09-01: 9,197 generated projects in
  # seven days occupied 256.41 GiB of Btrfs-exclusive space and added about
  # 35.0 GB of allocated files in the preceding 24 hours. This cleanup is
  # deliberately independent of worktree lifecycle: it removes generated
  # cache files only, after an atomic rename and process-reference checks.
  - name: rust_script_cache_cleanup
    cadence_secs: 3600
    gate:
      timeout_secs: 300
      cmd: python3 ci-hub/health/rust_script_cache_cleanup.py --apply --max-gib 64 --cache-root "$HOME/.cache/rust-script"
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: rust-script-cache-cleanup
      title: "rust-script cache cleanup needs attention: {summary}"

  # LEDGER PUBLICATION BACKLOG. Validation events are visible locally as soon as
  # the producer atomically admits an immutable *.jsonl spool batch, but they do
  # not become fleet-wide landing evidence until the publisher appends them to
  # tracked shards. From 2026-08-09 22:39 until 2026-08-11 this publication path
  # was stalled with no alarm. A zero-row consumer could not distinguish that
  # outage from "no validations ran". Measure the missing quantity directly:
  # completed batch count and age of the oldest unpublished batch. This entry is
  # DETECT ONLY and stays that way; the mutation lives in its own entry below so
  # observation never shares a budget with a push (see ledger_publish_sweep).
  # An OPEN pull request whose branch is deleted keeps rendering normally -- title,
  # head sha, diff and comments all come from stored metadata -- while the OBJECT
  # survives only until the remote collects it. ORC cannot see GitHub-side object
  # retention, so this earns its place under the admission test above.
  #
  # ⚠️ THE NUMBER IS A LOWER BOUND, NOT A COUNT. A sweep cannot see a tip that was
  # already collected; it counts the population standing at the moment it runs.
  # That is exactly why this is on a clock rather than an audit -- an audit measures
  # the survivors. Measured 2026-08-25: 27 open heads swept in 55s, 0 unreachable,
  # while two commits had gone readable->unreadable in a ten-minute window earlier
  # the same evening.
  #
  # DETECT-ONLY. It reports and never rescues: the salvage pattern is owned
  # elsewhere, and a push behind a timer is a different and much worse thing.
  # ⚠️ BOUND DECLARED FROM MEASUREMENT (2026-08-26). Without `timeout_secs` this
  # gate inherited tick_hub.probes.DEFAULT_GATE_TIMEOUT_SECS = 30, a constant in
  # a DIFFERENT REPOSITORY (agent-utils) carrying no comment and derived from no
  # gate's cost. 30 of the 35 reminders here inherit it silently.
  #
  # Measured end to end on a quiet box (load 17 of 316 cores), run to completion:
  # 32.09s wall, 7.39s cpu, at 34 open pull requests. It was 7% over the bound it
  # never declared, so it returned NO-RESULT -- the one outcome nobody reads as a
  # failure -- rather than its answer, which was "0 of 34 unreachable".
  #
  # THE COST IS SERIAL NETWORK, NOT COMPUTE: two `git fetch` probes per open pull
  # request (0.42-0.46s by sha, 0.27-0.28s by refs/pull), so ~0.9s per PR, and
  # cpu/wall is 0.23. IT SCALES WITH THE OPEN-PR QUEUE, which is the population
  # we are deliberately growing through: 300s covers roughly 300 open PRs and the
  # cadence is 3600s, so the bound is not the thing to watch -- the queue is.
  - name: pr_tip_reachability
    cadence_secs: 3600
    gate:
      timeout_secs: 300
      cmd: python3 ci-hub/health/pr_tip_reachability.py --gate
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: pr-tip-reachability
      title: "an OPEN pull request's head commit is no longer fetchable: {summary}"

  - name: ledger_spool_backlog
    cadence_secs: 3600
    gate:
      cmd: python3 ci-hub/health/ledger_spool_backlog.py --root "$DEV_HERMIT_PARENT" --gate
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: ledger-spool-backlog
      title: "validation ledger publication is stalled: {summary}"

  - name: series_spool_backlog
    cadence_secs: 3600
    gate:
      cmd: python3 ci-hub/health/ledger_spool_backlog.py --root "$DEV_HERMIT_PARENT" --store series --gate
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: series-spool-backlog
      title: "per-test series publication is stalled: {summary}"

  # Run one bounded sample of red cells with executable commands each day. The
  # health tick only
  # launches the work and returns; the fixed systemd unit prevents overlap.
  # The worker fetches current Hermit main into a clean worktree under ignored/
  # and enters validate-lock as a bench run, reserving both slots so the sample
  # cannot overlap a validate. It waits up to one hour for admission, then runs
  # ten verify, replay, or chaos cells at -j4 with a 60-second per-cell bound and
  # a 25-minute whole-run
  # bound. The result directory and a plain-file log are retained. The existing
  # pressure-test emit-series command writes the completed rows; a run that did
  # not compare remains a non-verdict in that writer.
  - name: pressure_test
    cadence_secs: 86400
    gate:
      timeout_secs: 30
      cmd: python3 ci-hub/series/pressure_schedule.py launch --state-root "$DEV_HERMIT_PARENT"
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: pressure-test
      title: "recurring pressure test needs attention: {summary}"

  # The mutation half, deliberately separated from the detector above. Detection
  # was never the whole problem: publication was a MANUAL command, so a receipt
  # stayed readable only by the parent that produced it -- VALIDATED to its
  # producer and NOT-VALIDATED to every other actor, landing authority included.
  # That recurred three times on 2026-08-11, worst case a fully qualifying
  # 794-second green invisible for 55 minutes.
  #
  # This LAUNCHES DETACHED and returns in ~0.04s; it never waits. That is not a
  # style choice: `unpushed_parent_commits --rescue` was removed on 2026-08-08
  # because a 65-75s mutation on the 30s gate budget made that gate report
  # "could not run ... timed out" every cycle for a day and emit no measurement
  # at all. A publish is heavier than a rescue, so it gets its own budget and
  # the detector keeps its own. The exit code reports only whether the unit was
  # ACCEPTED; whether publication succeeded is reported by the next
  # ledger_spool_backlog or series_spool_backlog observation, which is the
  # honest place for it.
  #
  # No new authority: this schedules the existing publisher for both stores. It
  # writes only through a dedicated clone, goes out via the serialized
  # parent-main-write, appends only, and drops a batch solely after the commit
  # carrying it is confirmed an ancestor of the freshly fetched remote.
  - name: ledger_publish_sweep
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/ledger/launch_publish_backlog.sh
      when: failure
      capture: true
    emit:
      kind: note
      fields:
        component: ledger-publish-sweep
      title: "ledger publish sweep: {summary}"

  # KEEPS THE OBJECTS THE ABOVE GATE READS FROM DISAPPEARING. The ledger records a
  # validate run against an exact commit, and nothing kept those objects reachable:
  # an off-main commit that was validated and then squashed or abandoned is present
  # but reachable from no ref, and `git gc --prune=now` deletes it. That is what made
  # validate_wall_regression refuse on every tick of 2026-08-20 and emit no verdict
  # at all. Measured on a faithful copy of the hermit checkout: a real
  # `git gc --prune=now` destroyed 115 of 303 ledger-named commits with no pins, and
  # 0 of them with pins.
  #
  # Runs every 6h rather than per-tick: it is cheap (0.9s for 327 refs) but it is
  # maintenance, not an alarm. It fires only when it CANNOT do its job -- a missing
  # checkout or a failed update-ref -- because "0 pinned" and "no checkout" otherwise
  # read identically.
  - name: ledger_referenced_objects
    cadence_secs: 21600
    gate:
      cmd: python3 ci-hub/health/ledger_referenced_objects.py --ledger "$DEV_HERMIT_PARENT/ledger" --root "$DEV_HERMIT_PARENT"
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: ledger-referenced-objects
      title: "ledger-referenced git objects are not being kept reachable: {summary}"

  # Emits ONLY a supportable verdict. Today the series cannot support one
  # (retention 3.91d < 90d; conditioning 4/26 = 15% < 90%), so this HOLDS at rc=0
  # and says so on stdout rather than claiming "no regression". Wiring
  # --fail-over-budget instead would fire every tick forever: the main median is
  # already 659s against a 600s budget -- a standing condition, not an event.
  - name: validate_wall_regression
    cadence_secs: 3600
    gate:
      cmd: python3 ci-hub/main-metrics/wall_series.py --ledger "$DEV_HERMIT_PARENT/ledger" --repo "$DEV_HERMIT_PARENT/hermit" --reverie-repo "$DEV_HERMIT_PARENT/reverie" --gate-regression
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: validate-wall-time
      title: "validate wall time regressed on main: {summary}"

  # The reason the gate above is holding, surfaced ONCE A DAY so the blocker stays
  # visible instead of the check being silently inert. Daily because it is a
  # backlog condition; a per-tick page would be noise.
  - name: validate_wall_series_readiness
    cadence_secs: 86400
    gate:
      cmd: python3 ci-hub/main-metrics/wall_series.py --ledger "$DEV_HERMIT_PARENT/ledger" --repo "$DEV_HERMIT_PARENT/hermit" --reverie-repo "$DEV_HERMIT_PARENT/reverie" --readiness
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: validate-wall-time
      title: "validate wall series still cannot support a verdict: {summary}"

  - name: owner_tooling_directives
    cadence_secs: 3600
    gate:
      cmd: python3 ci-hub/directives/check.py --ledger "$DEV_HERMIT_TOOL_ROOT/ci-hub/directives/ledger.json" --output "$DEV_HERMIT_PARENT/ignored/ci-hub/directives/latest.json" --state-root "$DEV_HERMIT_PARENT" --deadline-secs 180
      timeout_secs: 195
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: owner-tooling-directives
      title: "owner tooling directives need action: {summary}"

  # THE TICK POLICES ITS OWN CODE. Production now executes code and config from
  # an immutable checkout of freshly resolved origin/main while every mutable
  # subject is explicitly rooted at DEV_HERMIT_PARENT. This gate remains a
  # fail-closed defense for direct/manual invocation and damaged cache content.
  # Before that split, the parent was chronically behind origin/main because it
  # could not fast-forward while other agents held dirty paths. A behind-checkout
  # displayed LANDED content as modified, so `git restore` -- an entirely
  # ordinary cleanup command -- silently rewound live tick code. That happened TWICE to
  # unpushed_parent_commits on 2026-08-08; the second time the whole tick went
  # 4s -> 36s and the detector for unpushed work went blind, with `git status`
  # reporting the file CLEAN throughout.
  #
  # This does not prevent the restore -- nothing can, and nobody has to be
  # careless for it to happen. It removes the SILENCE: drift pages on the next
  # tick, by path. It pages only on STALE (clean at HEAD, behind origin/main),
  # never on work-in-progress edits, because a gate that fires during ordinary
  # editing gets ignored and is then worth nothing when the real thing happens.
  # Detect-only; repairing drift means syncing or landing, both owned decisions.
  - name: tick_code_currency
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/health/tick_code_currency.py --gate
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: tick-code-currency
      title: "the tick is running code that is not what landed: {summary}"

  # Local-only parent commits are the state that got 45 commits orphaned on
  # 2026-08-06. They emit no error and no failing check, so this runs on a timer.
  # --scope all is load-bearing -- a HEAD-scoped probe read 0 while 24 commits
  # sat unpublished.
  #
  # OBSERVATION ONLY ON THE TICK -- `--rescue` was REMOVED 2026-08-08. Measured:
  # the scan is 0.40s, while ONE herdr-run rescue round-trip took 65.8s and
  # 74.8s (both failing rc=69) and rescue makes two per commit. Sharing the 30s
  # budget meant this gate reported `could not run ... timed out` on EVERY cycle
  # for a full day and therefore never emitted a measurement -- while a 20-commit
  # stack sat in zero origin refs and had to be found by hand. Observation is
  # read-only and cheap; rescue is remote mutation and slow. They do not belong
  # on one budget. Run the rescue deliberately, off the tick:
  #   ./ci-hub/health/unpushed_parent_commits.py --scope all --rescue
  # (it bounds itself with --rescue-deadline and reports skipped-deadline rather
  # than implying coverage it never attempted).
  # Change clones are SEPARATE REPOSITORIES: `git worktree list` in the parent
  # lists none of them, so the gate above cannot see them however it is scoped.
  # That gate's 0 is the true answer for the parent and stays that way; this is a
  # second enumeration over a different population, not a widening of the first.
  # `dispose` already refuses to remove a clone holding such work, but a refusal
  # protects work already at risk without telling anyone it exists -- two commits
  # sat in an abandoned clone for two days and were found twice by accident.
  # Reporting only: this never pushes, disposes or preserves. It does fetch,
  # which is how it reads the remote, and asks the same own-branch containment
  # question `dispose` asks so the two instruments cannot report different
  # counts for the same clones.
  - name: unpushed_change_clone_commits
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/health/unpushed_change_clone_commits.py
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: unpushed-change-clone-commits
      # Deliberately neutral: this fires both when clones hold unpushed work and
      # when a remote was unreachable so the condition could not be determined.
      # The old wording asserted the first outcome for both, which would have
      # read a NO_RESULT as work at risk.
      title: "ci-hub change clones: {summary}"

  - name: unpushed_parent_commits
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/health/unpushed_parent_commits.py --scope all --root "$DEV_HERMIT_PARENT"
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: unpushed-parent-commits
      title: "parent commits exist ONLY locally (not yet published): {summary}"

  # A correct dirty-tree refusal must not make a published change disappear.
  # This reads the append-only activation obligations written before publication
  # and closes one only after the primary contains the candidate with clean
  # candidate paths. There is deliberately no age-out: elapsed time cannot turn
  # a guarded deferral into completion. Detection is read-only; the coordinator
  # still owns inspection and activation of the dirty primary.
  - name: activation_obligations
    cadence_secs: 3600
    gate:
      cmd: python3 scripts/ci-hub-clone-change.py activation-obligations --primary /home/newton/work/dev-hermit
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: activation-obligation
        summary: "NO-SIGNAL gate=activation_obligations reason=missing-captured-summary"
      title: "a published parent change is not active in the primary: {summary}"

  - name: primary_checkout_snapshot
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/health/operational_health.py primary-snapshot --state-root "$DEV_HERMIT_PARENT"
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: primary-checkout-snapshot
      title: "primary checkout snapshot needs attention: {summary}"

  # STAGED BY LAG, per the owner: "If hermit is <5 commits behind make a small
  # note. If it is more then get louder." Two gates, ONE measurement tool, so the
  # threshold is the only thing that differs between them.
  #
  # This is the DELTA/SUSTAINED/DEFERRAL family documented at the top of this file
  # applied to severity rather than to firing: the small note is emitted every
  # cycle and never paged, so it cannot compete with a live incident, and the loud
  # band is reserved for a lag nobody has acted on. THERE IS NO SNOOZE AND NO
  # CLEARING FLAG -- the only input that quiets either band is a smaller lag, and
  # the only way to get one is to bump the pin. The warning this replaces fired
  # ~30 times over nine hours on 2026-08-11, stayed accurate throughout, and
  # became furniture precisely because it had one volume.
  #
  # An unmeasurable pin or a rewritten reverie history exits 2 in BOTH bands on
  # purpose: routing a fault to one band would let the quiet band silently own it.
  - name: reverie_pin_lag_note
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/health/reverie_pin_lag.py --gate --min-lag 1 --max-lag 4 --root "$DEV_HERMIT_PARENT"
      when: failure
      capture: true
    emit:
      kind: note
      fields:
        component: reverie-pin-lag
      title: "reverie pin is slightly behind: {summary}"

  - name: reverie_pin_lag_escalation
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/health/reverie_pin_lag.py --gate --min-lag 5 --root "$DEV_HERMIT_PARENT"
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: reverie-pin-lag
      title: "reverie pin has fallen far behind and is blocking landings: {summary}"

  - name: github_main_health
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/health/operational_health.py github-main
      when: failure
      capture: true
    emit:
      # Hosted state is useful diagnostic evidence, not Hermit's landing
      # authority. Keep measuring and reporting failures, but do not page at
      # the same severity as ledger or unpushed-work failures.
      kind: note
      fields:
        component: github-main
      title: "GitHub main health is {state}: {summary}"

  # A half-applied repository-authority transition blocked 142/143 open Hermit
  # PRs while presenting as unrelated per-PR failures. Measure the one shared
  # authority directly and name its global blast radius. This gate is read-only:
  # recovery is to complete or roll back the serialized transition, never to
  # refire individual PRs until the authority is coherent again.
  - name: hermit_merge_gate_authority
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/health/operational_health.py merge-gate-authority
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: hermit-merge-gate-authority
      title: "GLOBAL Hermit merge authority is {state}: {summary}"

  - name: pull_request_health
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/health/operational_health.py pull-requests --census-cache-dir "$DEV_HERMIT_PARENT/ignored/ci-hub/pr-census-cache"
      # 90s, against a measured 19.49s wall. Raised from the 30s
      # DEFAULT_GATE_TIMEOUT_SECS on 2026-08-20 after per-gate measurement
      # (experiments/tick-cost-budget_20260820/) found this gate had a 1.5x
      # margin where every other gate had more than 4x -- and it is
      # simultaneously HALF the entire tick budget, 31.8 of 63.7 millicores.
      #
      # The margin matters more than the cost because of HOW this gate fails.
      # tick_hub/probes.py returns stdout="" on TimeoutExpired, so {summary}
      # cannot resolve and render_emit REFUSES the whole emission. A timeout
      # here is not a loud failure; it is the gate going quiet, which reads
      # identically to "no problems found". Two gates were silenced exactly that
      # way on 2026-08-19.
      #
      # It talks to the GitHub API, so its wall time is upstream latency plus
      # pagination, neither of which this box controls. 90s is ~4.6x the
      # measured wall, bringing it in line with the rest of the set.
      timeout_secs: 90
      when: failure
      capture: true
    emit:
      # This remains a real gate and a real report; NOTE is a severity demotion,
      # not silence. Hermit landing authority is local validate + the ledger.
      # The summary owns the census-age contract: after one 3600s cadence an
      # all_open count is rendered AS-OF ... (STALE), and staleness itself makes
      # this gate fail, so this title can never present an hours-old count as now.
      kind: note
      fields:
        component: pull-requests
      title: "open PR health is {state}: {summary}"

  # A DRAIN VERDICT THAT NEVER REACHED THE PULL REQUEST. `agent(hermit-004)`
  # analysed hermit#2304, reached a HOLD, wrote the whole thing into its task,
  # and closed WITHOUT POSTING; the PR's newest comment was from the previous
  # day. Found only because another agent happened to re-open the same PR. That
  # is the third of four stranding shapes recorded on 2026-08-24/25, all ending
  # identically -- work done, record says finished, the artifact shows nothing --
  # because CLOSING A TASK AND PUBLISHING A VERDICT ARE SEPARATE ACTS AND ONLY
  # ONE WAS EVER CHECKED. The rule mirrors the one `verified_close.py` already
  # applies to landing: no closure without a reference that resolves.
  #
  # IT EARNS ITS PLACE UNDER THE ADMISSION TEST rather than being a TaskGraph
  # census, which is permanently out of scope above. The fact measured is
  # WHETHER THE PULL REQUEST CARRIES THE VERDICT -- GitHub state, which ORC
  # cannot see. The TaskGraph is read only to know which PRs to ask about. The
  # recorded permalink must appear in the PR's real comment set, so a plausible
  # pasted URL does not satisfy it. GitHub being unreachable is exit 75 NO
  # RESULT: neither a pass nor a claim that a drain task failed publication.
  #
  # THE CUTOVER IS LOAD-BEARING AND WAS COMPUTED, NOT GUESSED. Enumerated before
  # enforcement: of 60 closed drain tasks against unmerged PRs, 25 recorded no
  # comment link -- but GitHub says 16 of those 25 DID post and only failed to
  # record the permalink. A retroactive gate would emit 25 findings, 16 of them
  # (64%) telling an agent to re-post a verdict that is already there; it would
  # be switched off the day it landed, exactly as drain_reconcile.py records
  # from its own 133-finding first run. --since scores only what closes from
  # here on, and the suppressed pre-cutover count is printed on every verdict so
  # the backlog stays visible. The 9 genuinely-silent ones are recoverable via
  # `--census --pre-cutover`.
  #
  # ⚠️ IF YOU MOVE THIS CUTOVER FORWARD you are not tightening the gate, you are
  # blanking whatever accumulated in between. Re-run the census first.
  #
  # --grace-mins 15 absorbs read-after-write lag: a comment posted seconds
  # before a tick may not be in the comment list the tick reads (the same hazard
  # that makes refs/pull/N/head report the OLD sha right after a push, which
  # broke two PRs on 2026-08-25). Deferral costs one tick and is COUNTED in the
  # output, never silent.
  - name: drain_verdict_published
    cadence_secs: 3600
    gate:
      cmd: python3 ci-hub/closure/drain_publication.py --since 2026-08-25T12:00:00+00:00 --grace-mins 15
      # Measured 2026-08-25: 25s for the full 72-task census with 67 PRs
      # fetched. The gated path fetches only PRs drained since the cutover, so
      # steady state is a handful -- but the cutover set grows across a drain
      # wave. tick-hub reports a timeout as NO-SIGNAL rather than interpreting
      # it as a publication gap. 120s is ~5x the worst case observed.
      timeout_secs: 120
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: drain-verdict-publication
      title: "a drain task closed with its verdict unpublished: {summary}"

  - name: ci_queue_health
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/health/operational_health.py queue-health
      when: failure
      capture: true
    emit:
      # Queue health is operational telemetry. A hosted queue problem is not a
      # Hermit landing veto and is not by itself a P0.
      kind: note
      fields:
        component: ci-queue-health
      title: "CI queue health is {state}: {summary}"

  # Durable, recycle-surviving alarm for SUSTAINED PMU-lane saturation. Unlike
  # ci_queue_health (which pages on any instantaneous red), this records every
  # observation to an append-only store and only fires when saturation has
  # persisted across N consecutive observations. `tick` exits 1 (sustained ->
  # page) or 2 (could-not-measure -> surface, never silent); exit 0 stays quiet
  # while still recording. The throttle a load-planner reads is
  # `lane_health.py throttle-check` (read-only, no gh) -- it NEVER gates
  # landings, because landing is what drains the lane.
  - name: ci_lane_saturation
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/runners/lane_health.py tick --store "$DEV_HERMIT_PARENT/ignored/ci-hub/lane-health.jsonl"
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: ci-lane-saturation
      title: "CI PMU lane {state}: {summary}"

  # ---------------------------------------------------------------------------
  # REMOVED 2026-08-08 -- owner directive (web): "tick hub should not be used for
  # interfering with these orc internal matters", and: "I never was involved with
  # ANY of those tick hub creations ... They are trying to rigidly remind the
  # agent of things it may not notice. This is good for external systems like
  # github but it seems dangerous in other cases."
  #
  # THE TEST EVERY GATE MUST NOW PASS: can ORC observe this directly? If YES,
  # tick-hub must not police it -- ORC holds the authoritative view and a second
  # observer can only manufacture disagreement. If NO (GitHub, GH Actions queues,
  # runner lanes, local disk, local git), tick-hub is exactly the right mechanism.
  #
  # The danger is ASYMMETRIC, which is why these four went rather than getting
  # patched: a false alarm about GitHub wastes a check, but a false alarm about
  # orc-internal state feeds a coordinator mandate that closes and respawns
  # agents with no permission needed. Same mechanism, incomparable blast radius.
  #
  #   stuck_agents                  -- asserted agent liveness. ORC owns the
  #                                    fleet. Produced a false "agent died" for
  #                                    the agent with the freshest activity
  #                                    timestamp on the box (2026-08-08).
  #   active_work_reconciliation    -- asserted task/owner/agent agreement. Both
  #                                    authorities are ORC's; only the copy could
  #                                    be wrong.
  #   unowned_high_priority_backlog -- censused the TaskGraph through a hardcoded
  #                                    DB path and reported a 108-task backlog
  #                                    against a database the orchestrator could
  #                                    not see for an entire session.
  #   unowned_residue               -- combined ORC fleet + TaskGraph owner +
  #                                    slot state. Its one non-ORC signal (a slot
  #                                    with no process cwd inside it) is now
  #                                    covered by `worktree_disk_residue` above.
  #
  # The scripts remain on disk and remain useful when a coordinator or agent runs
  # them ON REQUEST against a question it is actually asking. What is withdrawn
  # is their standing authority to interrupt and instruct.
  #
  # RE-SCOPED, NOT REMOVED: agent_container_lifecycle. Reclaiming leaked podman
  # containers is genuine resource cleanup that ORC cannot see (libpod scopes sit
  # outside the launching agent's cgroup, and ORC has no shell). But its reclaim
  # predicate falls back to "owner agent is absent from the ORC snapshot" ->
  # gracefully_remove(), so a stale or empty ignored/ci-hub/agent-snapshot.json
  # authorizes destroying a live agent's container -- and headless agents have no
  # tmux pane for the process-evidence path to rescue them. The audit half is
  # kept; `--apply` is withdrawn until the predicate rests on process evidence
  # alone. Follow-up: rescope-agent-container-reclaim-to-process-evidence.
  # ---------------------------------------------------------------------------
  - name: agent_container_lifecycle
    cadence_secs: 3600
    gate:
      cmd: ./ci-hub/health/bounded_gate.py --name agent_container_lifecycle --timeout-secs 45 -- ./scripts/agent-podman.rs reconcile --agents-json "$DEV_HERMIT_PARENT/ignored/ci-hub/agent-snapshot.json"
      timeout_secs: 55
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: agent-container-lifecycle
      # ⚠️ THE TITLE USED TO ASSERT A FINDING THE CHECK HAD NOT MADE. It read
      # "agent-owned containers need attention" for BOTH failure states, and the
      # tool has three: `ok`, `action-required`, and `error`. `when: failure`
      # fires on the last two alike, so a check that COULD NOT LOOK was announced
      # in the same words as a real backlog.
      #
      # Measured 2026-08-27, with the agent snapshot 24929s stale against its 600s
      # bound, the emitted line was titled "agent-owned containers need attention"
      # while its own summary said "container lifecycle check could not complete".
      # The state was in the fields; the TITLE is what a coordinator scanning
      # ACTION lines reads, and it said the opposite.
      #
      # `{state}` is rendered by the same substitution as `{summary}` -- the
      # memory_skill_sync block below already titles on it -- so this costs
      # nothing and makes "we found a backlog" and "we could not look" different
      # sentences.
      title: "agent-owned container lifecycle is {state} (REPORT-ONLY, coordinator reclaims): {summary}"

  # Memory <-> skill sync: the sync/lint scripts existed but nothing invoked them,
  # so being in-sync was luck. This reminder runs the authoritative structural
  # linter + the report-only contradiction scanner every hour. It PROPOSES a
  # reconciliation via the wakeup; the coordinator APPLIES it. Deletion hazard:
  # ORC sessionForget() is 1-based positional (indices shift) -> apply any memory
  # deletions in DESCENDING order. Details in the scanner's own report body.
  #
  # >>> INACTIVE / NOT YET WIRED <<<  This reminder is committed but DISABLED.
  # Uncommenting the block below is what takes the mechanical layer LIVE: the
  # existing operationalHealthHeartbeat re-reads this file every 60 min and will
  # begin firing the hourly memory<->skill hard-warn. Activation is the owner's
  # call. TO ACTIVATE: remove the leading '# ' from the block below (no ORC
  # restart needed; the next heartbeat tick picks it up).
  # - name: memory_skill_sync
  #   cadence_secs: 3600
  #   gate:
  #     cmd: ./ci-hub/health/operational_health.py memory-skill-sync
  #     when: failure
  #     capture: true
  #   emit:
  #     kind: action
  #     skill: hard-warn-coordinator
  #     fields:
  #       component: memory-skill-sync
  #     title: "memory<->skill sync is {state} (REPORT-ONLY, coordinator reconciles): {summary}"

  # A HEAD THAT NOTHING EVALUATED. Measured 2026-08-10: 6 of the 25 most recently
  # updated open PRs had ZERO workflow runs at their current head, and every one
  # was CONFLICTING -- GitHub cannot build refs/pull/N/merge for a conflicting PR,
  # so no pull_request run is created and the head is never checked.
  #
  # The danger is that the absence LOOKS LIKE HEALTH: with no runs there are no
  # failing checks, so every surface reads clean. "Evaluated and clean" and "never
  # evaluated" were indistinguishable until this check existed, and only the second
  # is dangerous. The tool reports three states, never two -- a red head is
  # EVALUATED_FAIL (someone else's page), and only a total absence of runs fires
  # here, so a visible failure is never laundered into an invisible one.
  - name: pr_head_never_evaluated
    cadence_secs: 3600
    gate:
      cmd: python3 ci-hub/health/unevaluated_head.py --repo rrnewton/hermit --limit 40 --gate
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: unevaluated-head
      title: "open PR head(s) that NO workflow ever evaluated -- not the same as passing: {summary}"

  # AN APPROVAL THAT NO LONGER BINDS TO THE HEAD IT WAS EARNED AGAINST, and the
  # composed state that makes this pair worth more than its halves: an approval
  # can survive a head change AND that head may never have been evaluated, so code
  # can be APPROVED, UNEVALUATED, AND LOOK FULLY GREEN. Observed on #1864.
  #
  # The two failures are NOT independent. merge-gate.yml's
  # invalidate-local-validation job -- which would retire the stale label -- is
  # itself a pull_request job, so the same conflict that prevents evaluation also
  # prevents invalidation. One cause disables both guards, which is why they show
  # up together.
  #
  # GATED ON `superseded`, WHICH ALSO COVERS THE COMBINED STATE, deliberately NOT
  # on `unverifiable`: see the daily entry below for why. Nothing is ever deleted
  # by this check -- a superseded review or local-validation cache simply stops
  # satisfying the gate and stays visible with its exact-head evidence.
  - name: approval_no_longer_binds_to_head
    cadence_secs: 3600
    gate:
      cmd: python3 ci-hub/health/approval_binding.py --repo rrnewton/hermit --gate --gate-on superseded
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: approval-binding
      title: "passed-review-* or locally-validated label(s) bound to a different head, including a head with no workflow run: {summary}"

  # THE STANDING BLOCKER behind the gate above, surfaced ONCE A DAY so it stays
  # visible instead of the check being silently inert -- the same treatment
  # validate_wall_series_readiness gets, and for the same reason.
  #
  # Today EVERY approval reads UNDETERMINED, because no reviewer emits a
  # machine-readable `APPROVED-AT: <lane> <sha>` line and the role tag does not
  # encode the lane (#1864's codex review is tagged `GPT-5 Codex`, #1727's is
  # `gpt-5.6-sol` -- neither contains "codex"). So an approval label cannot be
  # linked to the comment that earned it by any means except a human reading the
  # thread. That is a fleet-wide convention gap, not a per-PR event: gating a
  # 30-minute tick on it would fire forever and train everyone to skip the check,
  # which is the corrosion this file already avoids elsewhere. Daily keeps it
  # honest without making it noise. It retires itself once reviewers emit the
  # binding line.
  - name: approvals_unverifiable_against_head
    cadence_secs: 86400
    gate:
      cmd: python3 ci-hub/health/approval_binding.py --repo rrnewton/hermit --gate --gate-on unverifiable
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: approval-binding-readiness
      title: "approval(s) cannot be bound to any head; reviewers emit no APPROVED-AT line: {summary}"

  # SURFACING ONLY, AND DELIBERATELY NOT A GATE. Review bindings live on pull
  # requests, so a commit that reached main without one is outside anything this
  # check can see. Measured 2026-08-20 on hermit: 21 of 29 commits since 08-19
  # carried no associated PR, so the binding checks above could speak to 8 of
  # them and said nothing about the other 21 -- which reads as healthy. This
  # reports that coverage as a number instead. It does NOT gate: landing
  # directly on main is the owner's explicit working policy, local validate is
  # canonical, and making that path harder is a policy change, not a health
  # check. The wording keeps unobserved-by-this-check apart from unreviewed,
  # because they are different claims and only the first is being made.
  # ⚠️ BOUND DECLARED FROM MEASUREMENT (2026-08-26), same inherited-30s story as
  # pr_tip_reachability above. Measured twice, run to completion on a quiet box:
  # 61.26s and 60.55s wall (20.5s cpu) over a window of 124 commits. It is 2x the
  # bound it never declared, so this gate has been emitting NO-RESULT instead of
  # its answer.
  #
  # THE COST IS ONE SERIAL `gh api repos/.../commits/<sha>/pulls` PER COMMIT IN
  # THE WINDOW, ~0.49s each; the `git log` that opens the window is ~0.1s. So IT
  # GETS SLOWER EXACTLY WHEN WE SUCCEED -- 124 commits landed in the last day, and
  # a better day costs more. 300s covers ~600 commits/day at a 86400s cadence.
  - name: landing_observability
    cadence_secs: 86400
    gate:
      timeout_secs: 300
      cmd: python3 ci-hub/health/approval_binding.py --repo rrnewton/hermit --checkout hermit --landing-observability --since "1 day ago"
      when: always
      capture: true
    emit:
      kind: note
      fields:
        component: approval-binding-coverage
      title: "review-binding coverage of yesterday's landings: {summary}"

  # THE GATE RUNNER WAS GONE FOR TWO DAYS AND NOTHING SAID SO. On 2026-08-08 the
  # The gate-runner installation and credentials were deleted; the user
  # service stayed ENABLED and failed 203/EXEC for ~two days, and the missing
  # capacity presented as CI saturation -- gates parked with every leg finished,
  # Merge Gate repeatedly the worst workflow. It was later restored, but
  # restoring capacity is not the same as being able to SEE capacity disappear.
  # Correct-but-unscheduled is not protection, which is the whole reason this
  # entry exists rather than the tool merely existing.
  #
  # FOUR SURFACES, CHECKED SEPARATELY, and that is the design -- do not collapse
  # it. The service surface reported PRESENT over a DELETED installation, so a
  # naive single-surface monitor reproduces the original blindness exactly:
  # installation (not just "the directory exists" -- `_work` survived the
  # deletion), credentials, service (enabled is necessary and never sufficient --
  # it was enabled the entire two days), and registration with the repo.
  #
  # Absence is NO_RESULT and exits 2, never silence, so this is fail-visible in
  # the direction that matters. Verified by its own deletion bracket
  # (tests/test_gate_runner_presence.sh, 14 assertions) rather than by reading:
  # it builds a scratch install and unit, deletes the installation while leaving
  # the unit enabled, and reproduces UnitFileState=enabled with
  # ExecMainStatus=203. Live runner untouched.
  - name: gate_runner_presence
    cadence_secs: 3600
    gate:
      cmd: python3 ci-hub/health/gate_runner_presence.py --record "$DEV_HERMIT_PARENT/.tick-hub/gate-runner-presence.json"
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: gate-runner-presence
      title: "gate runner is not confirmably present on all four surfaces: {summary}"

  # FILESYSTEM HEADROOM. The 2026-08-17 out-of-disk incident took down ORC and
  # every running agent, and was found by an agent tripping over it -- nothing
  # was watching. This is the thing that watches.
  #
  # It deliberately does NOT use du, unlike worktree_disk_residue above (which
  # measures a different quantity, per-slot residue, and shells out to
  # `du -s --one-file-system`). On this filesystem a tree walk misleads in three
  # INDEPENDENT ways that do not cancel, so there is no correction factor:
  #   - files inside a process's mount namespace, and unlinked-but-held files,
  #     are invisible to du/ncdu/find (~9 TB was unfindable during the incident);
  #   - st_blocks is LOGICAL under compress=zstd:3, so du OVERSTATES
  #     (`du -x /data` reported 6.2T on a 3.42 TiB device);
  #   - every subvolume has its own st_dev, so `du -x` prunes at each one and
  #     UNDERSTATES (one path: 142G by `du -sh`, 0 by `du -shx`, same instant).
  # Measured together on a test filesystem: 393M, 16K, and a true 12.25M.
  # This gate reads btrfs's own allocator counters instead, which are
  # subvolume-agnostic, post-compression, and namespace-blind by construction.
  #
  # df is also the wrong number: btrfs types its chunks, so metadata can exhaust
  # while df reports the data pool's terabytes. On 2026-08-19 /data showed
  # 1018 GiB free by df and had 42.6 GiB of real metadata headroom. Headroom is
  # therefore (free inside the pool's own chunks) + (unallocated / redundancy),
  # and the redundancy divisor -- 2x for DUP metadata -- is the term people drop.
  #
  # Floors are absolute, not rate-projected, ON PURPOSE. Data burn was a firm
  # +142 GiB/day, but the metadata trend over 11.5 minutes was +0.019 GiB against
  # a 0.064 GiB sample swing: noise 3x signal. A rate that untrustworthy must not
  # be allowed to arm or disarm a gate.
  #
  # THE RUNAWAY-WRITER TRIGGERS ARE INDEPENDENT OF ALL OF THAT. The first version
  # of this gate computed the /proc writers walk every tick and then discarded it
  # unless headroom was already below floor, which coupled detection to
  # exhaustion: it reported the fire, not the smoke. The incident it exists for
  # was three processes writing ~4.5 TB each over 28 hours while the filesystem
  # still had room, and a 767 GiB runaway sitting on a filesystem with 1 TB free
  # raised nothing. Now a single fd at/above --writer-alert-gib (50), or growing
  # at/above --writer-growth-gib-per-hour (20), fails the gate on its own no
  # matter how much space remains. Verified firing at 0.36 GiB with 1007 GiB free.
  - name: btrfs_headroom
    cadence_secs: 3600
    gate:
      # Reads ~8 small sysfs files; no subprocess, no tree walk, no root. Cost is
      # flat regardless of how full or how fragmented the filesystem is, which is
      # the property `du`-based sizing cannot offer.
      # --writers-state is what makes the GROWTH trigger work: it remembers each
      # fd's size between ticks. Without it only the size trigger is live, and a
      # runaway is caught late rather than early.
      cmd: python3 ci-hub/health/btrfs_headroom.py --gate --mount /data --writers --writers-min-gib 8 --writers-state "$DEV_HERMIT_PARENT/.tick-hub/btrfs-headroom-writers.json"
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: btrfs-headroom
      title: "filesystem headroom is below floor: {summary}"

  # GATE-SET INTEGRITY. Nothing watched whether the watchers were configured,
  # and on 2026-08-19 three gates silently un-deployed: the reverie pin gate
  # lasted one tick, btrfs_headroom was absent from the live config for thirteen
  # hours after the disk filled, and it stayed losable by a revert or a stale
  # checkout. Each was found by a person, not by a machine.
  #
  # A gate that disappears produces SILENCE, and silence reads as health. This
  # asserts the small set of reminders whose absence is an incident, and
  # separately diffs the live set against origin/main -- which needs no
  # hardcoded list and catches the stale-checkout case a list cannot.
  #
  # It refuses (exit 2) rather than passing when its OWN expectations are empty
  # or the config cannot be read, because an expectation list that reads as
  # satisfied because it is empty is the exact defect it exists to detect.
  - name: gate_set_integrity
    cadence_secs: 3600
    gate:
      cmd: python3 ci-hub/health/gate_set_integrity.py
      when: failure
      capture: true
    emit:
      kind: action
      skill: hard-warn-coordinator
      fields:
        component: gate-set-integrity
      title: "a gate that should be watching is not configured: {summary}"

  # A DIRECTIVE AT 20% IS A PREFERENCE, NOT A RULE. The owner requires a full
  # hyperlink on any task that proxies a GitHub issue or pull request. Measured
  # 2026-08-25 across 57 open tasks: of the 10 whose own text cites a PR at all,
  # 2 hyperlink every one. The rule was already written down and unenforced, and
  # three tasks were written off as unmatchable because #19/#25/#50/#77/#80/#82/
  # #114/#115 name no repository and the obvious default repo is the wrong one.
  #
  # DELIBERATELY kind: note, NOT an action with hard-warn-coordinator. This is
  # advisory before it is blocking, for one concrete reason: a gate that stops
  # the first person it meets gets switched off, and a disabled gate is worse
  # than 20% compliance. Two separate mechanisms keep it advisory -- the gate
  # only fires for tasks created on or after its grandfather date, so the
  # existing backlog is reported and never fails; and it fires on task text
  # only, never on notes, which agents append continuously. Promote this to
  # kind: action once new_violations has sat at zero and the backlog is drained.
  - name: task_reference_hygiene
    cadence_secs: 3600
    gate:
      cmd: python3 ci-hub/health/operational_health.py task-reference-hygiene
      when: failure
      capture: true
    emit:
      kind: note
      fields:
        component: task-reference-hygiene
      title: "task reference hygiene: {summary}"

health_checks: []
